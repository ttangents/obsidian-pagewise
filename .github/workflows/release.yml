# Builds a release, attests the files, and drafts the GitHub release with
# them. Start it either way, then review the draft and publish it:
# - Actions → Release → Run workflow on main, with the version (0.39.0, no "v");
# - or push a version tag that names the manifest's version.
# A draft creates its tag when it is published, so the first way needs no tag.
# The release notes come from the version's section of CHANGELOG.md.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as in manifest.json (no "v")
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the version against the manifest
        run: test "$(node -p "require('./manifest.json').version")" = "$VERSION"

      - name: Check that the version has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "A release named $VERSION already exists. Delete it, or raise the version." >&2
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="## $VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi

      # Builds styles.css, type-checks, lints, runs the tests and bundles main.js.
      - run: npm run build

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" main.js manifest.json styles.css \
            --draft --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
